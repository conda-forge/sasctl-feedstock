context:
  name: sasctl
  version: "1.12.0"
  python_min: "3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/28/36/deec0bc5225f16abdfc5f49fc12f1b3ec07fd3d8ba135bd7b02d6a6cbcc9/sasctl-${{ version }}.tar.gz
  sha256: 32b8b9245db299c39f6640e4639df8143c4971d2e6e0158d5cf7e67cf12ffd7b

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dill
    - pandas >=0.24.0
    - requests
    - pyyaml
    - packaging
    - GitPython
    - scikit-learn

tests:
  - python:
      imports:
        - sasctl
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/sassoftware/python-sasctl/
  summary: 'The sasctl package enables easy communication between the SAS Viya platform and a Python runtime. It can be used as a module or as a command line interface.'
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/sassoftware/python-sasctl/

extra:
  recipe-maintainers:
    - EllaBootQC
