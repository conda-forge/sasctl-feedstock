context:
  name: sasctl
  version: "1.11.7"
  python_min: "3.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/9b/ec/2c3f7e4ad8fa4f5b3cdd2bd7f9e25a45d8e938935eb793c0b4a340db32de/sasctl-${{ version }}.tar.gz
  sha256: 2bb9e21ec9e6b98531e671ddb738b72e26bc19c115b4bed2f680163e71bd69c9

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - dill
    - pandas >=0.24.0
    - requests
    - pyyaml
    - packaging
    - GitPython
    - scikit-learn

tests:
  - python:
      imports:
        - sasctl
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/sassoftware/python-sasctl/
  summary: 'The sasctl package enables easy communication between the SAS Viya platform and a Python runtime. It can be used as a module or as a command line interface.'
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/sassoftware/python-sasctl/

extra:
  recipe-maintainers:
    - EllaBootQC
